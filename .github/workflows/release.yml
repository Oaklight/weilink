name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.7.0)"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches package
        run: |
          PKG_VER=$(python -c "import re; m=re.search(r'__version__\s*=\s*\"(.+?)\"', open('src/weilink/__init__.py').read()); print(m.group(1))")
          echo "Package version: $PKG_VER"
          echo "Requested version: ${{ inputs.version }}"
          [ "$PKG_VER" = "${{ inputs.version }}" ] || \
            (echo "::error::Version mismatch: __init__.py has $PKG_VER but release requested ${{ inputs.version }}"; exit 1)

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  build-publish-weilink:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish weilink to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-weilink
          path: dist/*
          retention-days: 7

  build-publish-pyilink:
    needs: build-publish-weilink
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pyilink alias package
        run: |
          pip install --upgrade pip build
          VER="${{ inputs.version }}"
          cd pyilink
          sed "s/version = \"0.0.0\"/version = \"${VER}\"/" pyproject.toml \
            | sed "s/weilink==0.0.0/weilink==${VER}/" > pyproject.toml.build
          mv pyproject.toml pyproject.toml.bak
          mv pyproject.toml.build pyproject.toml
          python -m build
          mv pyproject.toml.bak pyproject.toml

      - name: Publish pyilink to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pyilink/dist/

  github-release:
    needs: [build-publish-weilink, build-publish-pyilink]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-weilink
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
